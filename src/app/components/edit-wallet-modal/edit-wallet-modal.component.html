<ion-header>
  <ion-toolbar>
    <div class="modal-header">
      <div class="modal-title">
        <ion-icon name="wallet-outline"></ion-icon>
        <span>Chỉnh sửa ví</span>
      </div>
      <ion-icon name="close-circle-outline" class="close-btn" (click)="dismiss()"></ion-icon>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="showWallet">
  <div class="modal-body">

    <div class="wallet-badge">
      <ion-icon name="layers-outline"></ion-icon>
      <span>{{ walletOld.name }}</span>
    </div>

    <div class="form-field">
      <label class="field-label">Tên ví mới <span class="required">*</span></label>
      <ion-input
        class="custom-input"
        [(ngModel)]="walletData.name"
        [placeholder]="walletOld.name">
      </ion-input>
      <span class="hint">Hiện tại: <strong>{{ walletOld.name }}</strong></span>
    </div>

    <div class="form-field">
      <label class="field-label">Số dư mới</label>
      <ion-input
        class="custom-input"
        [(ngModel)]="walletData.balance"
        (ionInput)="onInputChangeBalance()"
        [placeholder]="walletOld.balance + ' đ'"
        inputmode="decimal">
      </ion-input>
      <span class="hint">Hiện tại: <strong>{{ walletOld.balance | number:'1.0-0' }} đ</strong></span>
    </div>

    <div class="btn-row">
      <ion-button fill="outline" color="medium" class="footer-btn" (click)="dismiss()">
        Hủy
      </ion-button>
      <ion-button color="success" class="footer-btn" (click)="updateWallet()">
        <ion-icon name="checkmark-outline" slot="start"></ion-icon>
        Lưu
      </ion-button>
    </div>

  </div>
</ion-content>
